<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #111; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 14px; line-height: 1.35; letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
  }

  /* Password screen */
  .gate {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: #fff;
  }
  .gate form { display: grid; gap: 10px; justify-items: center; }
  .gate label { font-size: 14px; color: #111; }
  .gate input {
    font: inherit; font-size: 15px; text-align: center;
    width: 220px; padding: 6px 0;
    border: 0; border-bottom: 1px solid #111; border-radius: 0;
    background: transparent; color: #111; outline: none;
  }
  .gate input::placeholder { color: #aaa; }
  .gate .no { color: #888; min-height: 1.35em; }
  .gate.shake form { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* The grid: three columns of work, each with its caption underneath */
  main { padding: 28px 28px 80px; }
  /* Masonry: three columns, each piece goes into whichever column is shortest. */
  .grid { display: flex; gap: 28px; align-items: flex-start; }
  .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 48px; }
  figure { margin: 0; }
  .grid img, .grid video { display: block; width: 100%; height: auto; background: #f4f4f4; }
  .grid img { cursor: zoom-in; }
  figcaption { margin-top: 10px; max-width: 34em; color: #111; }

  /* Full view of an image */
  .full {
    position: fixed; inset: 0; z-index: 5; background: rgba(255,255,255,.97);
    display: none; place-items: center; padding: 28px; cursor: zoom-out;
  }
  .full.open { display: grid; }
  .full img { max-width: 100%; max-height: 100%; object-fit: contain; }

  @media (max-width: 900px) { .grid { gap: 18px; } .col { gap: 36px; } main { padding: 18px 16px 60px; } }
</style>

    <label for="pw">password</label>
    <input id="pw" type="password" autofocus>
    <div class="no" id="no" aria-live="polite"></div>
  </form>
</div>

<main hidden id="work">
  <div class="grid" id="grid"></div>
</main>

<div class="full" id="full"><img alt=""></div>

const gate = document.getElementById('gate');
const work = document.getElementById('work');
const grid = document.getElementById('grid');
const full = document.getElementById('full');

function figureFor(it) {
  const fig = document.createElement('figure');
  let el;
  if (it.kind === 'video') {
    el = document.createElement('video');
    Object.assign(el, { muted: true, loop: true, playsInline: true, preload: 'none', poster: it.poster });
    el.src = it.src;
    el.setAttribute('aria-label', it.caption || 'video');
  } else {
    el = document.createElement('img');
    el.loading = 'lazy'; el.decoding = 'async';
    el.src = it.src; el.alt = it.caption || '';
    el.addEventListener('click', () => {
      full.querySelector('img').src = it.src;
      full.classList.add('open');
    });
  }
  el.width = it.w; el.height = it.h;           // reserves the right space before it loads
  fig.appendChild(el);
  if (it.caption) {
    const cap = document.createElement('figcaption');
    cap.textContent = it.caption;
    fig.appendChild(cap);
  }
  return fig;
}

const figures = new Map();
const io = new IntersectionObserver(entries => {
  for (const e of entries) e.isIntersecting ? e.target.play().catch(() => {}) : e.target.pause();
}, { rootMargin: '200px' });

let laidOut = 0;
function layout() {
  const n = innerWidth > 900 ? 3 : innerWidth > 560 ? 2 : 1;
  if (n === laidOut) return;
  laidOut = n;
  grid.replaceChildren();
  const cols = Array.from({ length: n }, () => { const c = document.createElement('div'); c.className = 'col'; grid.appendChild(c); return c; });
  const heights = new Array(n).fill(0);
  for (const it of ITEMS) {
    // In order, each piece drops into the shortest column (height measured as a share of column width).
    const i = heights.indexOf(Math.min(...heights));
    if (!figures.has(it)) figures.set(it, figureFor(it));
    cols[i].appendChild(figures.get(it));
    heights[i] += it.h / it.w + (it.caption ? 0.12 + it.caption.length / 900 : 0) + 0.1;
  }
}

function show() {
  gate.remove();
  work.hidden = false;
  // Build the grid only after unlocking, so nothing loads before the password.
  layout();
  grid.querySelectorAll('video').forEach(v => io.observe(v));
  addEventListener('resize', layout);
}

let ok = false;
try { ok = sessionStorage.getItem('work') === '1'; } catch (e) {}
if (ok) show();

document.getElementById('form')?.addEventListener('submit', e => {
  e.preventDefault();
  const pw = document.getElementById('pw');
  if (pw.value.trim().toLowerCase() === PASSWORD) {
    try { sessionStorage.setItem('work', '1'); } catch (e) {}
    show();
  } else {
    document.getElementById('no').textContent = 'not quite';
    gate.classList.remove('shake'); void gate.offsetWidth; gate.classList.add('shake');
    pw.value = '';
  }
});

full.addEventListener('click', () => full.classList.remove('open'));
addEventListener('keydown', e => { if (e.key === 'Escape') full.classList.remove('open'); });
