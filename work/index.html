<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work · Tahreem Rehman</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../media/me-metal.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #111; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 14px; line-height: 1.35; letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
  }

  /* Password screen */
  .gate {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: #fff;
  }
  .gate form { display: grid; gap: 10px; justify-items: center; }
  .gate label { font-size: 14px; color: #111; }
  .gate input {
    font: inherit; font-size: 15px; text-align: center;
    width: 220px; padding: 6px 0;
    border: 0; border-bottom: 1px solid #111; border-radius: 0;
    background: transparent; color: #111; outline: none;
  }
  .gate input::placeholder { color: #aaa; }
  .gate .no { color: #888; min-height: 1.35em; }
  .gate.shake form { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* The nav is an eye in the middle of the page: software, brand and tools sit on the iris,
     and the pupil is the in-between button that shows everything. */
  .iris {
    position: fixed; inset: 0; z-index: 4;
    display: grid; place-items: center;
    background: rgba(255,255,255,.8);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: opacity .45s ease, visibility 0s linear 0s;
  }
  .iris .ring {
    --d: min(340px, 76vw);
    position: relative; width: var(--d); height: var(--d);
    border: 1px solid #111; border-radius: 50%;
    transition: transform .75s cubic-bezier(.16,1,.3,1);
  }
  .iris button {
    font: inherit; font-size: 15px; color: #111; background: #fff; border: 0; padding: 4px 10px;
    position: absolute; cursor: pointer;
    text-decoration: underline; text-decoration-color: transparent;
    text-underline-offset: 4px; text-decoration-thickness: 1px; transition: text-decoration-color .2s;
  }
  .iris button:hover { text-decoration-color: #bbb; }
  .iris button[aria-pressed="true"] { text-decoration-color: currentColor; }
  .iris button[data-tab="software"] { left: 50%; top: 0;   transform: translate(-50%, -50%); }
  .iris button[data-tab="brand"]    { left: 0;   top: 50%; transform: translate(-50%, -50%); }
  .iris button[data-tab="tools"]    { left: 100%; top: 50%; transform: translate(-50%, -50%); }
  .iris button.pupil {
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 30%; aspect-ratio: 1; border-radius: 50%;
    background: #111; color: #fff; padding: 0;
    transition: background .25s;
  }
  .iris button.pupil:hover { background: #555; text-decoration-color: transparent; }
  .iris button.pupil[aria-pressed="true"] { text-decoration-color: transparent; }
  /* Closed: the eye shrinks away towards the dot at the top. */
  .iris.closed { opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .45s ease, visibility 0s linear .45s; }
  .iris.closed .ring { transform: scale(.03); transition: transform .45s cubic-bezier(.7,0,.84,0); }
  .iris svg { transition: opacity .35s ease .15s; }
  .iris.closed svg { opacity: 0; transition: opacity .2s ease; }

  /* The dot the nav becomes. Hovering it lightens it and brings back
     a ring of small dots in the iris's shape. */
  .dot {
    position: fixed; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 56px; height: 56px; border: 0; padding: 0; background: none; cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity .3s ease .25s;
  }
  .dot.on { opacity: 1; pointer-events: auto; }
  /* Hovering the dot fades the rest of the page to half, so the dot stands out. */
  main, .logo { transition: opacity .35s ease; }
  body:has(.dot.on:hover) main, body:has(.dot.on:hover) .logo,
  body:has(.dot.on:focus-visible) main, body:has(.dot.on:focus-visible) .logo { opacity: .3; }
  .dot::before {
    content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px;
    margin: -5px 0 0 -5px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4a4a50, #26262a 55%, #161618); box-shadow: 0 1px 2px rgba(0,0,0,.18); transition: background .2s;
  }
  .dot i {
    position: absolute; left: 50%; top: 50%; width: var(--s, 3px); height: var(--s, 3px); margin: calc(var(--s, 3px) / -2) 0 0 calc(var(--s, 3px) / -2);
    border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4a4a50, #26262a 55%, #161618); opacity: 0;
    transform: rotate(var(--a)) translateY(0);
    transition: opacity .2s ease, transform .3s ease;
  }
  .dot:hover::before, .dot:focus-visible::before { background: radial-gradient(circle at 35% 30%, #8c8c94, #66666e 55%, #4e4e55); }
  .dot:hover i, .dot:focus-visible i { opacity: 1; transform: rotate(var(--a)) translateY(-17px); }
  .dot:focus-visible { outline: none; }
  /* The gentlycarved signature, top middle, on the page and over the open iris. */
  .logo { position: absolute; z-index: 5; left: 50%; top: 22px; transform: translateX(-50%); display: block; }
  .logo img { display: block; width: 150px; height: auto; }
  .logo[hidden] { display: none; }
  main { padding-top: 110px !important; }

  /* The drawn eye: a glass disc with dots at its edge, hairlines from a small
     hub out to the rim, and the words sitting in the open. The hub is the pupil: "all". */
  .iris.drawn .ring { border: 0; border-radius: 50%; --d: min(400px, 84vw); }
  /* Frosted glass: the disc blurs the work behind it, with a bright rim and a soft shadow. */
  .iris.drawn .ring::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(255,255,255,.38) 55%, rgba(236,236,242,.55));
    -webkit-backdrop-filter: blur(22px) saturate(1.5); backdrop-filter: blur(22px) saturate(1.5);
    box-shadow: inset 0 1.5px 1px rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.65),
                inset 0 -14px 30px rgba(0,0,0,.06), 0 26px 60px rgba(0,0,0,.14), 0 3px 10px rgba(0,0,0,.08);
  }
  .iris.drawn svg { position: relative; }
  @media (max-width: 600px) { .iris.drawn .ring { --d: 62vw; } }
  /* A soft light that follows the pointer across the glass. */
  .iris.drawn .ring::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at var(--lx, 35%) var(--ly, 25%), rgba(255,255,255,.75), rgba(255,255,255,0) 42%);
    mix-blend-mode: soft-light; opacity: .9; transition: opacity .3s;
  }
  .iris.drawn .pupil:hover .hub, .iris.drawn .pupil:focus-visible .hub { fill: url(#hubDark); stroke: rgba(255,255,255,.95); }
  .iris.drawn .pupil:hover .word { fill: #fff; }
  .iris.drawn svg { display: block; width: 100%; height: 100%; overflow: visible; color: #111; }
  .iris.drawn [data-tab] { cursor: pointer; outline: none; }
  .iris.drawn text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #6b6b6b; transition: fill .2s; }
  /* Every word sits on the outer edge, upright, in STIX Two Text. */
  .iris.drawn .word, .iris.drawn .mword { font-family: "STIX Two Text", Georgia, serif; }
  .iris.drawn .word { font-size: 17px; fill: #6b6b6b; }
  .iris.drawn .pupil .word { font-size: 13px; }
  .iris.drawn .count { font-size: 9px; fill: #9a8582; }
  .iris.drawn .area { fill: transparent; transition: fill .3s; }
  .iris.drawn [data-tab]:hover .area, .iris.drawn [data-tab]:focus-visible .area { fill: rgba(255,255,255,.5); }
  .iris.drawn [data-tab]:hover .word, .iris.drawn [data-tab]:focus-visible .word,
  .iris.drawn [data-tab][aria-pressed="true"] .word { fill: #111; }
  .iris.drawn .hub { fill: url(#hubGlass); stroke: rgba(255,255,255,.95); stroke-width: 1; transition: fill .2s, stroke .2s; }

  /* Where two kinds meet: dashed lines with a small word on them, over the quarters. */
  .iris.drawn .meet { opacity: 0; transition: opacity .35s ease .15s; }
  .iris.drawn.meeting .meet, .iris.drawn svg:has(.pupil:hover) .meet, .iris.drawn .meet:hover { opacity: 1; transition-delay: 0s; }
  .iris.drawn .dash { fill: none; stroke: #111; stroke-opacity: .45; stroke-width: .8; stroke-dasharray: 2.5 3; transition: stroke .2s, stroke-opacity .2s; }
  .iris.drawn .grab { fill: transparent; }
  .iris.drawn .mword { font-size: 12.5px; fill: #8a8a8a; }
  .iris.drawn .meet [data-tab]:hover .mword, .iris.drawn [data-tab]:hover > .word { fill: #111; }
  .iris.drawn [data-tab].lit .area, .iris.drawn [data-tab].kept .area { fill: rgba(70,72,82,.12); }
  .iris.drawn [data-tab].kept > .word { fill: #111; }
  /* Where you are: its quarter is tinted and its word goes dark; with everything showing, the middle is. */
  /* Where you are: a darker, smoky glass segment with a white word. */
  .iris.drawn [data-tab][aria-pressed="true"] .area { fill: rgba(70,72,82,.30); }

  .iris.drawn .hub { filter: drop-shadow(0 2px 4px rgba(0,0,0,.14)); }
  .iris.drawn .pupil[aria-pressed="true"] .hub { fill: url(#hubDark); stroke: rgba(255,255,255,.7); }
  .iris.drawn .pupil[aria-pressed="true"] .word { fill: #fff; }
  .iris.drawn [data-tab].lit .word { fill: #111; }
  .iris.drawn .ring { position: relative; }
  .iris.drawn .why {
    position: absolute; left: 50%; top: calc(100% + 22px); transform: translateX(-50%);
    width: max-content; max-width: 88vw; margin: 0; text-align: center;
    font-size: 15px; color: #111; opacity: 0; transition: opacity .25s;
  }
  .iris.drawn .why.on { opacity: 1; }
  /* The hairlines open up around the meeting words only while those words are showing. */
  .iris.drawn.meeting .hairline, .iris.drawn svg:has(.pupil:hover) .hairline, .iris.drawn svg:has(.meet:hover) .hairline { mask: url(#gaps); }
  .iris.drawn .meet [data-tab]:hover .mword, .iris.drawn .meet [data-tab]:focus-visible .mword,
  .iris.drawn .meet [data-tab][aria-pressed="true"] .mword { fill: #111; }
  .iris.drawn .meet [data-tab]:hover .dash, .iris.drawn .meet [data-tab][aria-pressed="true"] .dash { stroke: #111; stroke-opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .iris, .iris .ring, .dot, .dot i { transition: none; } }

  /* The grid, after union.design: each project is a block of rows, tight to the edges
     with 4px between pieces; pieces fill their tiles. Captions live in the full view. */
  main { padding: 110px 10px 80px; font-size: 12px; line-height: 1.2; }
  .project { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; scroll-margin-top: 60px; }
  .row { display: grid; gap: 4px; }
  .row.one   { grid-template-columns: minmax(0, 1fr); }
  .row.two   { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .row.duo   { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
  .tile { position: relative; overflow: hidden; background: #f2f2f2; margin: 0; }
  .row.duo .tile:last-child { aspect-ratio: auto !important; height: 100%; }
  .tile > a { display: block; width: 100%; height: 100%; }
  /* Each piece sits whole inside its light grey card, with room around it, so nothing is cut off.
     Photos already close to the card's shape fill it edge to edge instead. */
  .tile img, .tile video { display: block; width: 100%; height: 100%; object-fit: contain; padding: 7%; box-sizing: border-box; cursor: zoom-in; }
  .tile.fill img, .tile.fill video { object-fit: cover; padding: 0; }
  .tile a img, .tile a video { cursor: pointer; }
  h2 { font: inherit; color: #737373; margin: 28px 0 8px; font-weight: 400; }
  h2:first-child { margin-top: 0; }
  .others .tile + .name { margin-top: 6px; }
  .other { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .other a.name { color: #111; text-decoration: none; }
  .other a.name:hover { color: #737373; }

  /* Which project you're looking at, top left, changing as you scroll. */
  .now {
    position: fixed; z-index: 3; left: 10px; top: 20px; width: min(320px, 40vw);
    display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 0 10px;
    font-size: 12px; line-height: 1.2; color: #111; transition: opacity .35s ease;
  }
  .now .num, .now .kinds { color: #737373; }
  .now .kinds { grid-column: 2; }
  body:has(.dot.on:hover) .now { opacity: .3; }

  /* Full view of an image, with its caption */
  .full {
    position: fixed; inset: 0; z-index: 8; background: rgba(255,255,255,.97);
    display: none; place-items: center; padding: 28px; cursor: zoom-out;
  }
  .full.open { display: grid; }
  .full figure { margin: 0; display: grid; justify-items: center; gap: 12px; }
  /* The whole image always fits the screen, however tall or wide it is. */
  .full img { width: auto; height: auto; max-width: calc(100vw - 56px); max-height: calc(100vh - 100px); object-fit: contain; }
  .full figcaption { max-width: 40em; text-align: center; font-size: 12px; color: #737373; }

  @media (max-width: 700px) {
    .row.three, .row.duo { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .row.duo .tile:last-child { aspect-ratio: 4 / 5 !important; height: auto; }
    .now { display: none; }
    /* On a phone each project is named above its pieces instead. */
    .project::before { content: attr(data-name); display: block; padding: 18px 0 4px; font-size: 12px; color: #111; }
    .project:first-child::before { padding-top: 0; }
  }
  /* The tee-print iris (last, so it wins over the earlier glass styles). */
  /* Flat, like a print on a tee: no glass. */
  .iris.drawn .ring::before, .iris.drawn .ring::after { display: none; }
  .iris.drawn .ring { filter: none; }
  .iris.drawn .word { font-size: 16px; fill: #3a3a3a; }
  .iris.drawn .mword { font-size: 12px; fill: #8a8a8a; }
  .iris.drawn .caption { font-family: "STIX Two Text", Georgia, serif; font-size: 11px; fill: #3a3a3a; }
  .iris.drawn .area { fill: transparent; }
  .iris.drawn [data-tab]:hover .area, .iris.drawn [data-tab]:focus-visible .area { fill: rgba(0,0,0,.025); }
  .iris.drawn [data-tab][aria-pressed="true"] .area, .iris.drawn [data-tab].lit .area, .iris.drawn [data-tab].kept .area { fill: rgba(0,0,0,.045); }
  .iris.drawn .portrait-color { opacity: 0; transition: opacity .7s ease; }
  .iris.drawn .pupil:hover .portrait-color, .iris.drawn .pupil:focus-visible .portrait-color { opacity: 1; }
  .iris.drawn .pupil { cursor: pointer; }
  .iris.drawn .pupil image { -webkit-user-select: none; user-select: none; }

  /* Colourway (from the user's reference): pale cool grey with soft light, charcoal ink,
     light grey for secondary words and lines, and a lime accent. Last, so it wins. */
  :root { --bg: #dee2e5; --light: #ebebeb; --card: #e9ecee; --ink: #393b3a; --muted: #9aa0a6; --line: #ced2d6; --lime: #a8c76b; --lime-ink: #7d9a45; }
  html, body { background: var(--bg); color: var(--ink); }
  body { background: radial-gradient(ellipse at 70% 15%, var(--light), var(--bg) 60%) fixed var(--bg); }
  .gate { background: var(--bg); }
  .gate label, .gate input { color: var(--ink); }
  .gate input { border-bottom-color: var(--ink); }
  .gate .no { color: var(--muted); }
  .tile { background: var(--card); }
  .now { color: var(--ink); }
  .now .num, .now .kinds, h2 { color: var(--muted); }
  .other a.name { color: var(--ink); }
  .other a.name:hover { color: var(--lime-ink); }
  .full { background: rgba(222,226,229,.97); }
  .full figcaption { color: var(--muted); }
  .iris { background: rgba(222,226,229,.82); }
  .iris.drawn .plate { fill: var(--card); stroke: var(--ink); }
  .iris.drawn .word, .iris.drawn .caption { fill: var(--ink); }
  .iris.drawn .mword { fill: var(--muted); }
  .iris.drawn [data-tab]:hover .word, .iris.drawn [data-tab]:focus-visible .word,
  .iris.drawn [data-tab][aria-pressed="true"] .word, .iris.drawn [data-tab].lit .word, .iris.drawn [data-tab].kept > .word,
  .iris.drawn .meet [data-tab]:hover .mword, .iris.drawn .meet [data-tab][aria-pressed="true"] .mword,
  .iris.drawn .pupil:hover .caption, .iris.drawn .pupil[aria-pressed="true"] .caption { fill: var(--lime-ink); }
  .iris.drawn [data-tab]:hover .area, .iris.drawn [data-tab]:focus-visible .area { fill: rgba(255,255,255,.35); }
  .iris.drawn [data-tab][aria-pressed="true"] .area, .iris.drawn [data-tab].lit .area, .iris.drawn [data-tab].kept .area { fill: rgba(168,199,107,.14); }
  .iris.drawn .pupil ellipse { stroke: var(--ink); }
  .dot::before { background: radial-gradient(circle at 35% 30%, #5a5c5b, #393b3a 55%, #2c2e2d); }
  .dot i { background: radial-gradient(circle at 35% 30%, #c9df9a, var(--lime) 55%, #8aa955); }
  .dot:hover::before, .dot:focus-visible::before { background: radial-gradient(circle at 35% 30%, #c9df9a, var(--lime) 55%, #8aa955); }

  /* Each piece as a card: a thin charcoal frame, a title bar with the project's name,
     the piece inside with a margin, and its caption underneath, on a faint green. */
  :root { --card-green: #edf3dd; }
  .project, .row { gap: 10px; }
  .project { margin-bottom: 10px; }
  .tile { background: var(--card-green); border: 1px solid var(--ink); display: flex; flex-direction: column; overflow: visible; aspect-ratio: auto !important; }
  .tile .bar { font-size: 13px; line-height: 1.2; padding: 7px 10px; border-bottom: 1px solid var(--ink); color: var(--ink); }
  .tile .pic { position: relative; overflow: hidden; margin: 10px 10px 0; }
  .tile .pic > a { display: block; width: 100%; height: 100%; }
  .tile img, .tile video { padding: 0; object-fit: contain; }
  .tile.fill img, .tile.fill video { object-fit: cover; }
  .tile figcaption { font-family: "STIX Two Text", Georgia, serif; font-size: 15px; line-height: 1.2; color: var(--ink); padding: 9px 10px 10px; }
  .tile .pic:last-child { margin-bottom: 10px; }
  .row.duo .tile:last-child { height: auto; }
  .row.duo .tile:last-child .pic { aspect-ratio: auto !important; flex: 1; }
  .other .tile .pic { aspect-ratio: 1; }

  /* Simple iris: faint blue disc, charcoal dots on its edge, a stronger green for what's picked. */
  :root { --lime: #9cc25a; --lime-ink: #6f9133; --card-green: #e3eecb; }
  .iris.drawn .plate { fill: #e6ecf3; stroke: #c3ccd6; stroke-width: 1; }
  .iris.drawn .bigdot, .iris.drawn .smalldot { fill: var(--ink); transition: fill .2s; }
  .iris.drawn [data-tab]:hover .bigdot, .iris.drawn [data-tab][aria-pressed="true"] .bigdot, .iris.drawn [data-tab].lit .bigdot, .iris.drawn [data-tab].kept .bigdot,
  .iris.drawn .meet [data-tab]:hover .smalldot, .iris.drawn .meet [data-tab][aria-pressed="true"] .smalldot { fill: var(--lime); }
  .iris.drawn [data-tab]:hover .area, .iris.drawn [data-tab]:focus-visible .area { fill: rgba(255,255,255,.45); }
  .iris.drawn [data-tab][aria-pressed="true"] .area, .iris.drawn [data-tab].lit .area, .iris.drawn [data-tab].kept .area { fill: rgba(156,194,90,.28); }
  .iris.drawn .hub { fill: #f3f6f9; stroke: #c3ccd6; stroke-width: 1; filter: none; transition: fill .2s; }
  .iris.drawn .pupil:hover .hub, .iris.drawn .pupil[aria-pressed="true"] .hub { fill: #d7e8b6; stroke: var(--lime); }
  .iris.drawn .caption { font-size: 13px; }

  /* Hover: only the word goes bold and its dot grows a little. */
  .iris.drawn .bigdot, .iris.drawn .smalldot { transform-box: fill-box; transform-origin: center; transition: transform .2s ease, fill .2s; }
  .iris.drawn [data-tab]:hover .area, .iris.drawn [data-tab]:focus-visible .area { fill: transparent; }
  .iris.drawn [data-tab]:not([aria-pressed="true"]):not(.kept):hover .word, .iris.drawn .meet [data-tab]:not([aria-pressed="true"]):hover .mword { fill: inherit; }
  .iris.drawn [data-tab]:hover .word, .iris.drawn [data-tab]:focus-visible .word { fill: var(--ink); font-weight: 600; }
  .iris.drawn .meet [data-tab]:hover .mword, .iris.drawn .meet [data-tab]:focus-visible .mword { fill: var(--muted); font-weight: 600; }
  .iris.drawn [data-tab]:hover .bigdot, .iris.drawn [data-tab]:focus-visible .bigdot,
  .iris.drawn .meet [data-tab]:hover .smalldot, .iris.drawn .meet [data-tab]:focus-visible .smalldot { fill: var(--ink); transform: scale(1.3); }
  .iris.drawn [data-tab][aria-pressed="true"] .word, .iris.drawn .meet [data-tab][aria-pressed="true"] .mword { fill: var(--lime-ink); }
  .iris.drawn [data-tab][aria-pressed="true"] .bigdot, .iris.drawn .meet [data-tab][aria-pressed="true"] .smalldot { fill: var(--lime); }
  .iris.drawn .pupil:hover .hub { fill: #f3f6f9; stroke: #c3ccd6; }
  .iris.drawn .pupil:hover .caption { fill: var(--ink); font-weight: 600; }

  /* The in-between words and their small dots always show. */
  .iris.drawn .meet { opacity: 1 !important; }

  /* Cards stay neutral: no green on them. */
  .tile { background: #eceef0 !important; }

  /* The iris in green. */
  .iris.drawn .plate { fill: #e5efcf; stroke: #c4d6a0; }
  .iris.drawn .hub, .iris.drawn .pupil:hover .hub { fill: #f3f8e8; stroke: #c4d6a0; }
  .iris.drawn .pupil[aria-pressed="true"] .hub { fill: #cfe3a6; stroke: var(--lime); }

    el.setAttribute('aria-label', it.caption || 'video');
    io.observe(el);
  } else {
    el = document.createElement('img');
    el.loading = 'lazy'; el.decoding = 'async';
    el.src = it.src; el.alt = it.caption || '';
    if (!it.url) el.addEventListener('click', () => {
      full.querySelector('img').src = it.src;
      full.querySelector('figcaption').textContent = it.caption || '';
      full.classList.add('open');
    });
  }
  if (it.url) {
    const a = document.createElement('a'); a.href = it.url; a.title = it.caption || '';
    if (/^https?:/.test(it.url)) { a.target = '_blank'; a.rel = 'noopener'; }
    a.appendChild(el); pic.appendChild(a);
  } else pic.appendChild(el);
  if (it.caption) { const cap = document.createElement('figcaption'); cap.textContent = it.caption; fig.appendChild(cap); }
  return fig;
}

// A tool someone else made: its picture and name, both linking to the tool.
function figureForOther(t) {
  const box = document.createElement('div'); box.className = 'other';
  const fig = document.createElement('figure'); fig.className = 'tile';
  const bar = document.createElement('div'); bar.className = 'bar'; bar.textContent = t.title;
  const pic = document.createElement('div'); pic.className = 'pic';
  const a = document.createElement('a'); a.href = t.url; a.target = '_blank'; a.rel = 'noopener';
  const img = document.createElement('img'); img.loading = 'lazy'; img.decoding = 'async'; img.alt = ''; img.src = t.img;
  a.appendChild(img); pic.appendChild(a); fig.append(bar, pic); box.appendChild(fig);
  return box;
}

const io = new IntersectionObserver(entries => {
  for (const e of entries) e.isIntersecting ? e.target.play().catch(() => {}) : e.target.pause();
}, { rootMargin: '200px' });

const figures = new Map();   // each piece is made once and moved between views
const fig = (it, make) => { if (!figures.has(it)) figures.set(it, make(it)); return figures.get(it); };

// Rows for one project: a wide piece gets a full-width row, the rest go three across,
// with a narrow-and-wide pair or two across where the count doesn't divide by three.
function rows(list) {
  const out = [], rest = list.slice();
  const row = (kind, pieces, ratios) => {
    const r = document.createElement('div'); r.className = 'row ' + kind;
    pieces.forEach((it, i) => {
      const t = fig(it, figureFor), rat = ratios[i] || '';
      t.querySelector('.pic').style.aspectRatio = rat;
      // A photo whose shape is within about 12% of its card fills the card; everything else sits whole inside.
      const [a, b] = (rat || '4 / 5').split('/').map(Number), card = b ? a / b : a;
      const near = Math.abs(Math.log((it.w / it.h) / card)) < 0.12;
      t.classList.toggle('fill', near && ['Shot on film', 'Me'].includes(it.project) && rat !== '');
      r.appendChild(t);
    });
    out.push(r);
  };
  const wide = it => it.w / it.h >= 1.25;
  let sinceFull = 0;
  while (rest.length) {
    if (wide(rest[0]) && (out.length === 0 || sinceFull >= 2 || rest.length === 1)) {
      row('one', [rest.shift()], ['16 / 9']); sinceFull = 0; continue;
    }
    if (rest.length === 1) { row('one', [rest.shift()], ['16 / 9']); continue; }
    if (rest.length === 2) { row('duo', rest.splice(0, 2), ['4 / 5', '']); continue; }
    if (rest.length === 4) { row('two', rest.splice(0, 2), ['1', '1']); row('two', rest.splice(0, 2), ['1', '1']); continue; }
    row('three', rest.splice(0, 3), ['4 / 5', '4 / 5', '4 / 5']); sinceFull++;
  }
  return out;
}

// Group pieces into projects, in the order each project first appears.
function projects(list) {
  const groups = new Map();
  for (const it of list) { if (!groups.has(it.project)) groups.set(it.project, []); groups.get(it.project).push(it); }
  return [...groups].sort((a, b) => a[1][0].p - b[1][0].p).map(([name, pieces]) => {
    const sec = document.createElement('section'); sec.className = 'project';
    sec.dataset.name = name;
    sec.dataset.kinds = [...new Set(pieces.flatMap(p => p.tags).filter(t => ['software', 'brand', 'tools', 'fun'].includes(t)))].join(', ');
    sec.append(...rows(pieces));
    return sec;
  });
}

// The label top left follows the project in the middle of the screen.
const now = document.getElementById('now');
const watch = new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting) {
    const s = e.target, n = String([...view.querySelectorAll('.project')].indexOf(s) + 1).padStart(3, '0');
    now.innerHTML = `<span class="num">${n}</span><span>${s.dataset.name}</span><span class="kinds">${s.dataset.kinds}</span>`;
  }
}, { rootMargin: '-45% 0px -50% 0px' });

const TABS = ['software', 'brand', 'tools', 'fun', 'websites', 'merch', 'toys', 'products', 'easter eggs', 'systems'];
let tab = null, laidOut = '';
function layout() {
  const n = innerWidth > 700 ? 'wide' : 'narrow';
  if (laidOut === tab + n) return;
  laidOut = tab + n;
  document.querySelectorAll('.iris [data-tab]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === (tab || '')));
  if (typeof markTab === 'function') markTab(tab);
  const parts = [];
  const heading = text => { const h = document.createElement('h2'); h.textContent = text; return h; };
  if (tab === 'tools') {
    parts.push(heading('by me'), ...projects(ITEMS.filter(it => it.tags.includes('tools'))));
    const others = document.createElement('div'); others.className = 'row three others';
    others.style.gridTemplateColumns = `repeat(${innerWidth > 700 ? 4 : 2}, minmax(0, 1fr))`;
    OTHERS.forEach(t => others.appendChild(fig(t, figureForOther)));
    parts.push(heading('by others'), others);
  }
  else parts.push(...projects(tab ? ITEMS.filter(it => it.tags.includes(tab)) : ITEMS));
  view.replaceChildren(...parts);
  watch.disconnect(); now.textContent = '';
  view.querySelectorAll('.project').forEach(p => watch.observe(p));
}

// Picking from the iris shows that work and shrinks the eye to the dot at the top.
// The open tab is kept in the address (#software, #brand, #tools) so a link can point straight at it.
const iris = document.getElementById('iris'), dot = document.getElementById('dot');

// Which drawing of the eye to use: "ring" is the plain one, "disc" the drawn one (?iris=disc to preview).
const IRIS = new URLSearchParams(location.search).get('iris') || '/*IRIS*/ring';
let markTab = null;
if (IRIS === 'disc') drawIris();

function drawIris() {
  const NS = 'http://www.w3.org/2000/svg', C = 200, R = 182, HUB = 22;
  const rad = d => d * Math.PI / 180, pt = (r, d) => [C + r * Math.cos(rad(d)), C + r * Math.sin(rad(d))];
  const count = t => t ? ITEMS.filter(it => it.tags.includes(t)).length + (t === 'tools' ? OTHERS.length : 0) : ITEMS.length;
  const ring = iris.querySelector('.ring');
  ring.replaceChildren();
  iris.classList.add('drawn');
  // Four quarters, one for each kind of work.
  const AREAS = { software: [-135, -45], brand: [-45, 45], fun: [45, 135], tools: [135, 225] };
  // Pairs side by side meet on the line between them; pairs across from each other meet on a ring round the middle.
  const EDGE = { websites: -45, merch: 45, toys: 135, products: 225 };
  // Pairs across from each other sit just above and below the middle.
  const RINGS = { 'easter eggs': -62, systems: 28 };
  // How each pair meets: the two kinds it joins, and a line on what happens where they cross.
  const HOW = {
    websites:      ['software', 'brand', 'a brand you can click through'],
    merch:         ['brand', 'fun', 'a brand you can wear, wash with and seal a letter with'],
    toys:          ['fun', 'tools', 'tools made to be played with'],
    products:      ['tools', 'software', 'tools people open every day to do their work'],
    'easter eggs': ['software', 'fun', 'jokes and surprises hidden inside software'],
    systems:       ['brand', 'tools', 'tools that make a brand: palettes, type, marks'],
  };
  // Simple: a faint blue disc with dots on its edge (large for the four kinds, small for the
  // in-between words), each word beside its dot, and a small "all" circle in the middle.
  const IN = 30;
  const sector = ([a0, a1]) => {
    const [x1, y1] = pt(IN, a0), [x2, y2] = pt(R, a0), [x3, y3] = pt(R, a1), [x4, y4] = pt(IN, a1);
    return `<path class="area" d="M ${x1},${y1} L ${x2},${y2} A${R},${R} 0 0,1 ${x3},${y3} L ${x4},${y4} A${IN},${IN} 0 0,0 ${x1},${y1} Z"/>`;
  };
  // A word just outside the rim, upright, anchored away from the circle.
  const edge = (t, d, gap, size, cls) => {
    const [x, y] = pt(R + gap, d), c = Math.cos(rad(d)), sn = Math.sin(rad(d));
    const anchor = c > .3 ? 'start' : c < -.3 ? 'end' : 'middle';
    const dy = sn < -.3 ? -2 : sn > .3 ? size * .8 : size * .32;
    return `<text class="${cls}" x="${x}" y="${y + dy}" text-anchor="${anchor}">${t}</text>`;
  };
  const dot = (d, r, cls) => { const [x, y] = pt(R, d); return `<circle class="${cls}" cx="${x}" cy="${y}" r="${r}"/>`; };
  let m = `<circle class="plate" cx="${C}" cy="${C}" r="${R}"/>`;
  for (const [t, a] of Object.entries(AREAS)) {
    const d = (a[0] + a[1]) / 2;
    m += `<g data-tab="${t}" role="button" tabindex="0" aria-label="${t}">${sector(a)}${dot(d, 7, 'bigdot')}${edge(t, d, 14, 17, 'word')}</g>`;
  }
  m += `<g class="meet">`;
  for (const [t, d] of Object.entries({ ...EDGE, ...RINGS })) {
    const [gx, gy] = pt(R + 26, d);
    m += `<g data-tab="${t}" role="button" tabindex="0" aria-label="${t}">
      <circle class="grab" cx="${gx}" cy="${gy}" r="24"/>${dot(d, t in RINGS ? 3 : 4, 'smalldot')}${edge(t, d, 11, 12.5, 'mword')}</g>`;
  }
  m += `</g>
    <g class="pupil" data-tab="" role="button" tabindex="0" aria-label="all">
      <circle class="hub" cx="${C}" cy="${C}" r="${IN - 4}"/>
      <text class="caption" x="${C}" y="${C + 4.5}" text-anchor="middle">all</text></g>`;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 400 400');
  svg.innerHTML = m;
  ring.appendChild(svg);
  // Lines never run through a word: a mask cuts a small gap in them around each meeting word.
  const mask = document.createElementNS(NS, 'mask');
  mask.id = 'gaps'; mask.setAttribute('maskUnits', 'userSpaceOnUse');
  mask.setAttribute('x', 0); mask.setAttribute('y', 0); mask.setAttribute('width', 400); mask.setAttribute('height', 400);
  let holes = `<rect x="0" y="0" width="400" height="400" fill="#fff"/>`;
  svg.querySelectorAll('.mword').forEach(t => {
    const b = t.getBBox();
    holes += `<rect x="${b.x - 4}" y="${b.y - 1}" width="${b.width + 8}" height="${b.height + 2}" rx="3" fill="#000"/>`;
  });
  mask.innerHTML = holes;
  svg.prepend(mask);
  svg.querySelectorAll('.dash').forEach(d => d.setAttribute('mask', 'url(#gaps)'));
  svg.querySelectorAll('[data-tab]').forEach(g => {
    g.addEventListener('click', e => { e.stopPropagation(); setTab(g.dataset.tab); });
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setTab(g.dataset.tab); } });
  });
  // Hovering a meeting word lights up the two kinds it joins and says how they meet.
  const why = document.createElement('p'); why.className = 'why'; ring.appendChild(why);
  svg.querySelectorAll('.meet [data-tab]').forEach(g => {
    const [a, b, line] = HOW[g.dataset.tab];
    const on = v => {
      svg.querySelectorAll(`[data-tab="${a}"], [data-tab="${b}"]`).forEach(q => q.classList.toggle('lit', v));
      why.textContent = v ? `${a} + ${b}: ${line}` : '';
      why.classList.toggle('on', v);
    };
    g.addEventListener('pointerenter', () => on(true));
    g.addEventListener('pointerleave', () => on(false));
    g.addEventListener('focus', () => on(true));
    g.addEventListener('blur', () => on(false));
  });
  // The meeting words show while "all" is the open choice, or while you hover the middle.
  markTab = t => {
    iris.classList.toggle('meeting', !t || !['software', 'brand', 'tools', 'fun'].includes(t));
    const pair = HOW[t] ? HOW[t].slice(0, 2) : [];
    svg.querySelectorAll('[data-tab]').forEach(q => q.classList.toggle('kept', pair.includes(q.dataset.tab)));
  };
  // The light on the glass follows the pointer.
  iris.addEventListener('pointermove', e => {
    const b = ring.getBoundingClientRect();
    ring.style.setProperty('--lx', ((e.clientX - b.left) / b.width * 100).toFixed(1) + '%');
    ring.style.setProperty('--ly', ((e.clientY - b.top) / b.height * 100).toFixed(1) + '%');
  });
}
// Twelve small dots around the dot, in the iris's shape, for when it is hovered.
for (let k = 0; k < 8; k++) { const i = document.createElement('i'); i.style.setProperty('--a', k * 45 + 'deg'); i.style.setProperty('--s', (k % 2 ? 3 : 5) + 'px'); dot.appendChild(i); }
function openIris(open) {
  iris.classList.toggle('closed', !open);
  dot.classList.toggle('on', !open);
  document.body.style.overflow = open ? 'hidden' : '';
}
function setTab(t) {
  tab = TABS.includes(t) ? t : null;
  history.replaceState(null, '', location.pathname + location.search + (tab ? '#' + encodeURIComponent(tab) : ''));
  layout();
  scrollTo(0, 0);
  openIris(false);
}
document.querySelectorAll('.iris button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
dot.addEventListener('click', () => openIris(true));
// Clicking the empty page around the eye closes it again, once there is work behind it.
iris.addEventListener('click', e => { if (e.target === iris && laidOut) openIris(false); });
addEventListener('keydown', e => { if (e.key === 'Escape' && laidOut && !iris.classList.contains('closed')) openIris(false); });

function show() {
  gate.remove();
  work.hidden = false;
  // Build the grid only after unlocking, so nothing loads before the password.
  // A link to a tab goes straight to its work; otherwise the eye opens first.
  const linked = decodeURIComponent(location.hash.slice(1));
  tab = TABS.includes(linked) ? linked : null;
  layout();
  document.getElementById('logo').hidden = false;
  openIris(true);
  addEventListener('resize', layout);
}

let ok = false;
try { ok = sessionStorage.getItem('work') === '1'; } catch (e) {}
if (ok) show();

document.getElementById('form')?.addEventListener('submit', e => {
  e.preventDefault();
  const pw = document.getElementById('pw');
  if (pw.value.trim().toLowerCase() === PASSWORD) {
    try { sessionStorage.setItem('work', '1'); } catch (e) {}
    show();
  } else {
    document.getElementById('no').textContent = 'not quite';
    gate.classList.remove('shake'); void gate.offsetWidth; gate.classList.add('shake');
    pw.value = '';
  }
});

full.addEventListener('click', () => full.classList.remove('open'));
addEventListener('keydown', e => { if (e.key === 'Escape') full.classList.remove('open'); });
</script>
</body>
