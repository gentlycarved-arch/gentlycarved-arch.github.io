<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fafafa; color: #1d1d1d; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 17px; line-height: 1.55; letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  /* Password screen, the same as the work page */
  .gate { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: #fff; }
  .gate form { display: grid; gap: 10px; justify-items: center; }
  .gate label { font-size: 14px; }
  .gate input {
    font: inherit; font-size: 15px; text-align: center; width: 220px; padding: 6px 0;
    border: 0; border-bottom: 1px solid #111; border-radius: 0; background: transparent; color: #111; outline: none;
  }
  .gate .no { color: #888; min-height: 1.35em; font-size: 14px; }

  /* One reading column; the videos sit a little wider than the text */
  article { max-width: 640px; margin: 0 auto; padding: 56px 20px 120px; }
  .back { display: inline-block; font-size: 14px; color: #999; text-decoration: none; margin-bottom: 64px; }
  .back:hover { color: #1d1d1d; }
  h1 { font: inherit; font-weight: 500; margin: 0; }
  .when { color: #999; margin: 2px 0 36px; }
  p { margin: 0 0 22px; }
  ul { margin: 0 0 22px; padding-left: 1.1em; }
  li { margin-bottom: 6px; }

  figure { margin: 44px -120px 48px; }
  figure.square, figure.tall { margin-top: 44px; margin-bottom: 48px; }
  .frame {
    border-radius: 14px; overflow: hidden; background: #fff;
    border: 1px solid rgba(0,0,0,.06);
    box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 24px 70px rgba(0,0,0,.07);
  }
  video { display: block; width: 100%; height: auto; cursor: pointer; }
  figure.square { margin-left: auto; margin-right: auto; max-width: 560px; }
  figure.tall { margin-left: auto; margin-right: auto; max-width: 480px; }
  .bare video { background: transparent; }
  figcaption { max-width: 640px; margin: 14px auto 0; padding: 0 0 0 0; color: #999; font-size: 14px; text-align: center; }
  .note { color: #999; font-size: 14px; margin-top: 56px; }

  @media (max-width: 900px) { figure.wide { margin-left: 0; margin-right: 0; } }
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form id="form" autocomplete="off">
    <label for="pw">password</label>
    <input id="pw" type="password" autofocus>
    <div class="no" id="no" aria-live="polite"></div>
  </form>
</div>

<article id="page" hidden>
  <a class="back" href="../#software">work</a>
  <h1>Native</h1>
  <p class="when">native.works, 2026</p>
  <p>Native is a writing &amp; design studio that helps technology companies articulate what they believe and find their believers. I designed its website and identity.</p>

  <figure class="wide"><div class="frame"><video muted loop playsinline preload="none" style="aspect-ratio: 1920 / 1080" poster="../../media/native/native-choose-a-region-1920x1080.jpg" data-src="../../media/native/native-choose-a-region-1920x1080.mp4" aria-label="The glyphs are native to where you are. Choose a region and the site draws its own plants, fish and creatures."></video></div></figure>
  <figure class="square"><div class="frame"><video muted loop playsinline preload="none" style="aspect-ratio: 1080 / 1080" poster="../../media/native/native-glyphs-by-region-1080.jpg" data-src="../../media/native/native-glyphs-by-region-1080.mp4" aria-label="Each region has its own set: seven plants, a fish and two creatures, each drawn as a real species."></video></div></figure>

  <figure class="wide"><div class="frame"><video muted loop playsinline preload="none" style="aspect-ratio: 1920 / 1080" poster="../../media/native/native-writing-hover-20261111-1920x1080.jpg" data-src="../../media/native/native-writing-hover-20261111-1920x1080.mp4" aria-label="Writing: essays and conversations on narrative, technology and the craft of building things that matter. Hovering a title brings up its pull quote."></video></div></figure>

  <figure class="square"><div class="frame"><video muted loop playsinline preload="none" style="aspect-ratio: 1080 / 1080" poster="../../media/native/native-footer-specimen-card-1080.jpg" data-src="../../media/native/native-footer-specimen-card-1080.mp4" aria-label="The footer carries a specimen card for the region’s glyph."></video></div></figure>
</article>

<script>
// Not real security, like the work page: it only keeps this out of casual view.
const PASSWORD = 'affogato';
const gate = document.getElementById('gate'), page = document.getElementById('page');
let ok = false;
try { ok = sessionStorage.getItem('work') === '1'; } catch (e) {}

function show() {
  gate.remove(); page.hidden = false;
  // Videos load only once unlocked, play while on screen, and a click pauses or plays them.
  const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? e.target.play().catch(() => {}) : e.target.pause()), { rootMargin: '100px' });
  page.querySelectorAll('video').forEach(v => {
    v.src = v.dataset.src;
    io.observe(v);
    v.addEventListener('click', () => v.paused ? v.play() : v.pause());
  });
}
if (ok) show();
else {
  gate.hidden = false;
  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const pw = document.getElementById('pw');
    if (pw.value.trim().toLowerCase() === PASSWORD) { try { sessionStorage.setItem('work', '1'); } catch (e) {} show(); }
    else { document.getElementById('no').textContent = 'not quite'; pw.value = ''; }
  });
}
</script>
</body>
</html>
