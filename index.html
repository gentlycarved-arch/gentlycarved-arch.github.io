<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tahreem Rehman</title>
<meta name="description" content="daydreamer &amp; designer">
<link rel="canonical" href="https://gentlycarved.com/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gentlycarved.com/">
<meta property="og:title" content="Tahreem Rehman">
<meta property="og:description" content="daydreamer &amp; designer">
<meta property="og:image" content="https://gentlycarved.com/media/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@gentlycarved">
<link rel="icon" href="media/me-metal.png">
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  body { overflow: hidden; }
  :root { --sq: min(78vh, 78vw); }   /* the photo's square, a little smaller than the screen */

  /* A photo of me in a square, broken into a fine random grain that fades out to white.
     Hovering it (or tapping, on a phone) brings the colour back in the same grain. */
  .photo {
    position: fixed; left: 50%; top: 50%;
    width: var(--sq); height: var(--sq);
    transform: translate(-50%, -50%);
    animation: fade 1.8s ease-out both;
    cursor: default;
  }
  /* The photo is drawn as a background, not an <img>, so there is no image to "Save as". */
  .photo .layer {
    position: absolute; inset: 0;
    background: center / 100% 100% no-repeat;
  }
  .photo .bw    { background-image: url("media/me-grain.png"); }
  .photo .color { background-image: url("media/me-grain-color.png"); }
  /* No long-press save sheet, no selecting, no dragging. */
  .photo, .photo .layer, #logo {
    -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
    -webkit-user-drag: none;
  }
  .photo .color { opacity: 0; transition: opacity .7s ease; }
  .photo:hover .color, .photo.on .color { opacity: 1; }
  @keyframes fade { from { opacity: 0; } }

  /* The gentlycarved signature in its grainy charcoal texture, centered over the square.
     Multiply lets the grain read through the dark logo. */
  #logo {
    position: fixed; left: 50%; top: 50%;
    width: min(calc(var(--sq) * 1.78), 112vw); height: auto;
    transform: translate(-50%, -50%);
    mix-blend-mode: multiply;
    pointer-events: none;
  }
  @media (max-width: 760px) { :root { --sq: 90vw; } #logo { width: 122vw; } }
  @media (prefers-reduced-motion: reduce) { .photo { animation: none; } }
</style>
</head>
<body>
  <div class="photo">
    <div class="layer bw" role="img" aria-label="A photo of me as a child at the computer"></div>
    <div class="layer color"></div>
  </div>
  <canvas id="logo" role="img" aria-label="gentlycarved"></canvas>
<script>
// No right-click menu or dragging anywhere on the page, so the photo can't be saved from it.
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());

// Phones have no hover: a tap on the photo switches the colour on and off.
document.querySelector('.photo').addEventListener('pointerup', e => {
  if (e.pointerType !== 'mouse') e.currentTarget.classList.toggle('on');
});

(() => {
  const SRC = 'media/gc-signature.jpg';
  const EMERGE_MS = 2200;  // the logo rising out of the page
  const TONE = 46;         // the logo's charcoal

  const view = document.getElementById('logo');
  const img = new Image();
  img.src = SRC;
  img.onload = () => {
    const W = img.naturalWidth, H = img.naturalHeight, N = W * H;

    // 1. Read the halftone dots as ink.
    const work = document.createElement('canvas');
    work.width = W; work.height = H;
    const wc = work.getContext('2d', { willReadFrequently: true });
    wc.drawImage(img, 0, 0);
    const data = wc.getImageData(0, 0, W, H), px = data.data;
    const bg = (px[0] + px[1] + px[2]) / 3;
    let a = new Float32Array(N);
    for (let i = 0, j = 0; j < N; i += 4, j++) {
      a[j] = Math.min(1, Math.max(0, (bg - (px[i] + px[i + 1] + px[i + 2]) / 3) / (bg - 20)));
    }

    // 2. Soften the dots just enough to join them, keeping the halftone at the edges.
    const boxH = (src, dst, r) => {
      for (let y = 0; y < H; y++) {
        const o = y * W; let sum = 0;
        for (let x = -r; x <= r; x++) sum += src[o + Math.min(W - 1, Math.max(0, x))];
        for (let x = 0; x < W; x++) {
          dst[o + x] = sum / (2 * r + 1);
          sum += src[o + Math.min(W - 1, x + r + 1)] - src[o + Math.max(0, x - r)];
        }
      }
    };
    const boxV = (src, dst, r) => {
      for (let x = 0; x < W; x++) {
        let sum = 0;
        for (let y = -r; y <= r; y++) sum += src[Math.min(H - 1, Math.max(0, y)) * W + x];
        for (let y = 0; y < H; y++) {
          dst[y * W + x] = sum / (2 * r + 1);
          sum += src[Math.min(H - 1, y + r + 1) * W + x] - src[Math.max(0, y - r) * W + x];
        }
      }
    };
    let tmp = new Float32Array(N);
    for (let k = 0; k < 3; k++) { boxH(a, tmp, 2); boxV(tmp, a, 2); }

    // 3. Flocked texture: a solid charcoal shape with a grainy, fuzzy edge and flecks in the fill.
    const T = 0.32;
    for (let i = 0, j = 0; j < N; i += 4, j++) {
      const b = a[j];
      const s = Math.min(1, Math.max(0, (b - (T - 0.08)) / 0.16));
      // Grain stays inside the shape: no halo or grey patch on the page around it.
      let al = s > 0 ? s * 1.5 - 0.25 + (Math.random() - 0.5) * 0.9 : 0;
      if (Math.random() < 0.12) al *= 0.65;
      al = Math.min(1, Math.max(0, al));
      const tone = TONE + (Math.random() - 0.5) * 40;
      px[i] = px[i + 1] = px[i + 2] = tone;
      px[i + 3] = Math.round(al * 255);
    }
    wc.putImageData(data, 0, 0);

    // A small copy of the softened ink, for the emerge: the densest ink surfaces first,
    // then swells outward until it meets the finished shape.
    const F = 3, mW = Math.ceil(W / F), mH = Math.ceil(H / F);
    const field = new Float32Array(mW * mH);
    for (let y = 0; y < mH; y++) for (let x = 0; x < mW; x++) {
      field[y * mW + x] = a[Math.min(H - 1, y * F) * W + Math.min(W - 1, x * F)];
    }
    a = tmp = null;
    let peak = 0;
    for (const v of field) if (v > peak) peak = v;

    const mask = document.createElement('canvas');
    mask.width = mW; mask.height = mH;
    const mc = mask.getContext('2d');
    const md = mc.createImageData(mW, mH), mp = md.data;
    const setMask = th => {
      for (let j = 0, i = 0; j < field.length; j++, i += 4) {
        const v = Math.min(1, Math.max(0, (field[j] - th) / 0.06 + 0.5));
        mp[i + 3] = Math.round(v * 255);
      }
      mc.putImageData(md, 0, 0);
    };
    let done = false;

    const vc = view.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const size = () => {
      const cssW = view.getBoundingClientRect().width;
      view.width = Math.round(cssW * dpr);
      view.height = Math.round(cssW * dpr * H / W);
    };
    view.width = W; view.height = H;
    size();

    const draw = () => {
      vc.globalCompositeOperation = 'source-over';
      vc.clearRect(0, 0, view.width, view.height);
      if (!done) {
        vc.imageSmoothingQuality = 'high';
        vc.drawImage(mask, 0, 0, view.width, view.height);
        vc.globalCompositeOperation = 'source-in';
      }
      vc.drawImage(work, 0, 0, view.width, view.height);
      vc.globalCompositeOperation = 'source-over';
    };
    addEventListener('resize', () => { size(); draw(); });

    // Hovering the logo itself (its shape, not its box) lets the info step back.

    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { done = true; draw(); return; }

    // Emerge: lower the threshold from just under the densest ink to below the final edge.
    const from = peak * 0.92, to = T - 0.14;
    let start = null;
    const frame = now => {
      if (start === null) start = now;
      const p = Math.min(1, (now - start) / EMERGE_MS);
      const e = 1 - Math.pow(1 - p, 2);             // ease out: surfaces, then settles
      setMask(from + (to - from) * e);
      view.style.opacity = Math.min(1, p * 2.5);
      draw();
      if (p < 1) requestAnimationFrame(frame);
      else { done = true; view.style.opacity = 1; draw(); }
    };
    view.style.opacity = 0;
    requestAnimationFrame(frame);
  };
})();
</script>
</body>
</html>
